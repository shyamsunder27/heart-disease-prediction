{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  <p class="sub">Patients and administrators</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div class="field"><label for="username">Gmail ID / admin username</label>
      <input id="username" name="username" type="text" autocomplete="username" placeholder="you@gmail.com" required autofocus></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" required></div>
    <button type="submit">Log in</button>
    <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</div>
{% endblock %}
